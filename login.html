<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Iniciar Sesión - Sistema de Préstamos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header i {
            font-size: 3rem;
            color: #2563eb;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .toggle-form {
            color: #2563eb;
            cursor: pointer;
            text-decoration: none;
        }
        
        .toggle-form:hover {
            text-decoration: underline;
        }
        
        #formRegistro {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-shield-lock"></i>
            <h2 class="mt-2">Sistema de Préstamos</h2>
            <p class="text-muted">Inicia sesión para continuar</p>
        </div>
        
        <!-- Formulario de Login -->
        <form id="formLogin">
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="emailLogin" 
                           placeholder="ejemplo@correo.com" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="passwordLogin" 
                           placeholder="Tu contraseña" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-login w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
            </button>
            
            <div class="text-center mt-3">
                <span class="text-muted">¿No tienes cuenta?</span>
                <a class="toggle-form" onclick="mostrarRegistro()">Regístrate aquí</a>
            </div>
        </form>
        
        <!-- Formulario de Registro -->
        <form id="formRegistro">
            <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="nombreRegistro" 
                           placeholder="Tu nombre" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="emailRegistro" 
                           placeholder="ejemplo@correo.com" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="passwordRegistro" 
                           placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>
            </div>
            
            <button type="submit" class="btn btn-success w-100 mb-2">
                <i class="bi bi-person-plus me-2"></i>Crear Cuenta
            </button>
            
            <div class="text-center mt-3">
                <span class="text-muted">¿Ya tienes cuenta?</span>
                <a class="toggle-form" onclick="mostrarLogin()">Inicia sesión</a>
            </div>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <script>
        // Inicializar Firebase Auth
        const auth = firebase.auth();
        
        // ============ CAMBIAR ENTRE LOGIN Y REGISTRO ============
        function mostrarRegistro() {
            document.getElementById('formLogin').style.display = 'none';
            document.getElementById('formRegistro').style.display = 'block';
        }
        
        function mostrarLogin() {
            document.getElementById('formRegistro').style.display = 'none';
            document.getElementById('formLogin').style.display = 'block';
        }
        
        // ============ REGISTRO ============
        document.getElementById('formRegistro').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('nombreRegistro').value;
            const email = document.getElementById('emailRegistro').value;
            const password = document.getElementById('passwordRegistro').value;
            
            try {
                // Crear usuario
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                
                // Guardar nombre en Firestore
                await db.collection('usuarios').doc(userCredential.user.uid).set({
                    nombre: nombre,
                    email: email,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                alert('✅ Cuenta creada exitosamente');
                window.location.href = 'index.html';
                
            } catch (error) {
                console.error('Error:', error);
                if (error.code === 'auth/email-already-in-use') {
                    alert('❌ Este correo ya está registrado');
                } else if (error.code === 'auth/weak-password') {
                    alert('❌ La contraseña debe tener al menos 6 caracteres');
                } else {
                    alert('❌ Error: ' + error.message);
                }
            }
        });
        
        // ============ LOGIN ============
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('emailLogin').value;
            const password = document.getElementById('passwordLogin').value;
            
            try {
                await auth.signInWithEmailAndPassword(email, password);
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error:', error);
                if (error.code === 'auth/user-not-found') {
                    alert('❌ Usuario no encontrado');
                } else if (error.code === 'auth/wrong-password') {
                    alert('❌ Contraseña incorrecta');
                } else {
                    alert('❌ Error: ' + error.message);
                }
            }
        });
        
        // Verificar si ya está logueado
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
